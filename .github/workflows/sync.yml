name: Sync

on:
  schedule:
    # 每 6 小时同步一次（UTC 02/08/14/20 → 北京时间 10/16/22/04），
    # 缩短「插件发布 → 市场可见」的最坏滞后
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: 同步插件动态信息
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行同步脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync.py

      - name: 校验同步结果
        run: python scripts/validate.py index.json del-plugins.json

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.md5.json unreachable-plugins.json
          if git diff --cached --quiet; then
            echo "清单无变化，跳过提交"
          else
            git commit -m "chore(sync): 从 GitHub API 更新插件动态信息"
            git push
          fi
